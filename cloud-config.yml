azs:
- name: z1

vm_types:
- name: default

disk_types:
- name: default
  disk_size: 1024

networks:
- name: default
  type: manual
  subnets:
  - range: 10.245.0.0/16
    gateway: 10.245.0.1
    azs: [z1]
    dns: [8.8.8.8]
    reserved: [10.245.0.2-10.245.0.20]
    static: [10.245.0.21-10.245.0.40]
    cloud_properties:
      name: bosh-net

compilation:
  workers: 2
  reuse_compilation_vms: true
  vm_type: default
  network: default
  az: z1